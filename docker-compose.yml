services:
  db:
    image: postgres:17-alpine
    container_name: export-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: export_analytics
      POSTGRES_USER: export_user
      POSTGRES_PASSWORD: export_dev_password
    volumes:
      - gea_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U export_user -d export_analytics"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./backend
    container_name: export-analytics-api
    restart: unless-stopped
    working_dir: /app
    environment:
      APP_NAME: Guatemala Export Analytics
      APP_VERSION: 0.5.0
      DATABASE_URL: postgresql+psycopg://export_user:export_dev_password@db:5432/export_analytics
      RAW_CSV_PATH: /data/raw/exportaciones_banguat.csv
      SAC_PDF_PATH: /data/raw/sac.pdf
      FRONTEND_ORIGIN: http://127.0.0.1:5173
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
    container_name: export-analytics-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: http://127.0.0.1:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

volumes:
  gea_postgres_data:
  frontend_node_modules:
