services:
  - type: web
    name: guatemala-export-analytics-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.production
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN_REGEX
        value: '^https://.*\\.vercel\\.app$'
      - key: APP_NAME
        value: Guatemala Export Analytics
      - key: APP_VERSION
        value: 1.0.0
